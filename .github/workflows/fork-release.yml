name: Fork Release

# Fork-only release: builds Android + desktop clients and publishes them to this
# repo's GitHub Releases whenever a pull request is merged into main.
#
# Upstream's workflows (release.yml, pr-checks.yml, ...) are disabled in this fork's
# Actions settings instead of being edited, so syncing from upstream stays conflict-free.
#
# Optional secrets:
#   KMP_KEYSTORE (base64 of the .jks/.keystore file), KMP_SIGNING_STORE_PASSWORD,
#   KMP_SIGNING_KEY_ALIAS, KMP_SIGNING_KEY_PASSWORD
#     Without them the APK is signed with the runner's throwaway debug key, so each
#     release will NOT install over the previous one.
#   PHOEBE_GOOGLE_MAPS_ANDROID_API_KEY, PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY
#     Without them map views are blank; everything else works.

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

# Serialize real releases. PRs closed without merging get their own group, otherwise their
# no-op run could replace (cancel) a pending release run in the queue.
concurrency:
  group: fork-release-${{ (github.event_name == 'pull_request' && !github.event.pull_request.merged) && github.run_id || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin
  BUILD_REF: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
  # Fork identity, applied by .github/fork/rebrand.sh in every build job so the apps
  # install and keep their data alongside upstream Phoebe. Don't change these after
  # people have installed a release.
  FORK_APP_NAME: Phoebe+
  FORK_APPLICATION_ID: com.phoebe.app.fork
  FORK_UPGRADE_UUID: FD8339D3-0751-4AE8-B939-74821778C38E
  FORK_DATA_DIR: .phoebe-plus
  FORK_GITHUB_OWNER: ${{ github.repository_owner }}

jobs:
  version:
    name: Compute version
    # Never run in upstream if this file ever lands there, and only for merged PRs.
    if: >-
      github.repository == 'jpage4500/Phoebe' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Compute version
        id: version
        shell: bash
        run: |
          base_code="$(grep '^phoebe.versionCode=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')"
          if [[ -z "${base_code}" ]]; then
            echo "::error::gradle.properties must define phoebe.versionCode"
            exit 1
          fi
          # Upstream's versionCode only goes up and so does run_number, so the sum keeps
          # increasing: each APK installs over the last, and desktop installers (whose
          # version is 100.0.<versionCode> for date-style names) upgrade cleanly.
          version_code=$((base_code + GITHUB_RUN_NUMBER))
          version="$(date -u +"%Y.%m%d.%H%M")"
          {
            echo "version=${version}"
            echo "version_code=${version_code}"
            # The in-app updater only parses "v1.2.3" / "release/1.2.3" tags.
            echo "tag_name=v${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "Version ${version} (code ${version_code})"

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KMP_KEYSTORE: ${{ secrets.KMP_KEYSTORE }}
      KMP_SIGNING_STORE_PASSWORD: ${{ secrets.KMP_SIGNING_STORE_PASSWORD }}
      KMP_SIGNING_KEY_ALIAS: ${{ secrets.KMP_SIGNING_KEY_ALIAS }}
      KMP_SIGNING_KEY_PASSWORD: ${{ secrets.KMP_SIGNING_KEY_PASSWORD }}
      PHOEBE_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_ANDROID_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # v5, not v6: v6 moves caching into a proprietary component with its own terms of use.
        uses: gradle/actions/setup-gradle@v5

      - name: Rebrand as Phoebe+
        shell: bash
        run: ./.github/fork/rebrand.sh

      - name: Install projectM build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build projectM for Android ABIs
        shell: bash
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            ./scripts/build-projectm.sh "android-${abi}"
          done

      - name: Configure Android signing
        shell: bash
        run: |
          if [[ -z "${KMP_KEYSTORE}" || -z "${KMP_SIGNING_STORE_PASSWORD}" || -z "${KMP_SIGNING_KEY_ALIAS}" || -z "${KMP_SIGNING_KEY_PASSWORD}" ]]; then
            echo "::warning::Android signing secrets are not set; the APK is signed with a throwaway debug key and will not install over earlier releases."
            exit 0
          fi
          keystore_path="${RUNNER_TEMP}/phoebe-release.jks"
          echo "${KMP_KEYSTORE}" | base64 --decode > "${keystore_path}"
          if ! keytool -list -keystore "${keystore_path}" -storepass "${KMP_SIGNING_STORE_PASSWORD}" -alias "${KMP_SIGNING_KEY_ALIAS}" > /dev/null; then
            echo "::error::KMP_KEYSTORE could not be opened with KMP_SIGNING_STORE_PASSWORD / KMP_SIGNING_KEY_ALIAS (KMP_KEYSTORE must be the base64 of the keystore file)"
            exit 1
          fi
          {
            echo "PHOEBE_ANDROID_SIGNING_STORE_FILE=${keystore_path}"
            echo "PHOEBE_ANDROID_SIGNING_STORE_PASSWORD=${KMP_SIGNING_STORE_PASSWORD}"
            echo "PHOEBE_ANDROID_SIGNING_KEY_ALIAS=${KMP_SIGNING_KEY_ALIAS}"
            echo "PHOEBE_ANDROID_SIGNING_KEY_PASSWORD=${KMP_SIGNING_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build Android APK
        run: >
          ./gradlew
          :androidApp:assembleRelease
          -Pphoebe.versionName=${{ needs.version.outputs.version }}
          -Pphoebe.versionCode=${{ needs.version.outputs.version_code }}

      - name: Collect APK
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          apk="$(find androidApp/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [[ -z "${apk}" ]]; then
            echo "::error::Could not find the release APK"
            exit 1
          fi
          cp "${apk}" "release-artifacts/PhoebePlus-${VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          if-no-files-found: error
          path: release-artifacts/*

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # v5, not v6: v6 moves caching into a proprietary component with its own terms of use.
        uses: gradle/actions/setup-gradle@v5

      - name: Rebrand as Phoebe+
        shell: bash
        run: ./.github/fork/rebrand.sh

      - name: Install projectM build deps
        run: brew install cmake glm

      - name: Build projectM
        run: ./scripts/build-projectm.sh macos-arm64

      # Unsigned and not notarized: after installing, run
      #   xattr -dr com.apple.quarantine /Applications/Phoebe+.app
      # or allow it under System Settings > Privacy & Security.
      - name: Build DMG
        run: >
          ./gradlew
          :composeApp:packageReleaseDmg
          -Pphoebe.versionName=${{ needs.version.outputs.version }}
          -Pphoebe.versionCode=${{ needs.version.outputs.version_code }}

      - name: Print packaging logs
        if: failure()
        shell: bash
        run: |
          find composeApp/build/compose/logs -type f -name 'jpackage-*.txt' 2>/dev/null | sort | while read -r f; do
            echo "::group::${f}"; sed -n '1,240p' "${f}"; echo "::endgroup::"
          done

      - name: Collect DMG
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          dmg="$(find composeApp/build -name '*.dmg' -print -quit)"
          if [[ -z "${dmg}" ]]; then
            echo "::error::Could not find the DMG"
            exit 1
          fi
          cp "${dmg}" "release-artifacts/PhoebePlus-${VERSION}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          path: release-artifacts/*

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # v5, not v6: v6 moves caching into a proprietary component with its own terms of use.
        uses: gradle/actions/setup-gradle@v5

      - name: Rebrand as Phoebe+
        shell: bash
        run: ./.github/fork/rebrand.sh

      - name: Install projectM build deps
        shell: pwsh
        run: |
          & "${env:VCPKG_INSTALLATION_ROOT}\vcpkg.exe" install glew:x64-windows

      - name: Build projectM
        shell: bash
        run: ./scripts/build-projectm.sh windows-x64

      # Unsigned: Windows SmartScreen will warn on first launch ("More info" > "Run anyway").
      - name: Build MSI
        shell: pwsh
        run: >
          ./gradlew
          :composeApp:packageReleaseMsi
          "-Pphoebe.versionName=${{ needs.version.outputs.version }}"
          "-Pphoebe.versionCode=${{ needs.version.outputs.version_code }}"

      - name: Collect MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null
          $msi = Get-ChildItem -Path "composeApp/build" -Recurse -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "Could not find the MSI" }
          Copy-Item $msi.FullName "release-artifacts/PhoebePlus-${env:VERSION}.msi"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: release-artifacts/*

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY: ${{ secrets.PHOEBE_GOOGLE_MAPS_DESKTOP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # v5, not v6: v6 moves caching into a proprietary component with its own terms of use.
        uses: gradle/actions/setup-gradle@v5

      - name: Rebrand as Phoebe+
        shell: bash
        run: ./.github/fork/rebrand.sh

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot cmake ninja-build libgl1-mesa-dev libglm-dev

      - name: Build projectM
        run: ./scripts/build-projectm.sh linux-x64

      - name: Build DEB
        run: >
          ./gradlew
          :composeApp:packageReleaseDeb
          -Pphoebe.versionName=${{ needs.version.outputs.version }}
          -Pphoebe.versionCode=${{ needs.version.outputs.version_code }}

      - name: Collect DEB
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          deb="$(find composeApp/build -name '*.deb' -print -quit)"
          if [[ -z "${deb}" ]]; then
            echo "::error::Could not find the DEB"
            exit 1
          fi
          cp "${deb}" "release-artifacts/PhoebePlus-${VERSION}.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: release-artifacts/*

  release:
    name: Publish GitHub release
    needs:
      - version
      - android
      - macos
      - windows
      - linux
    # Publish whatever platforms built, so one flaky desktop runner doesn't block the APK.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RESULTS: >-
            Android: ${{ needs.android.result }},
            macOS: ${{ needs.macos.result }},
            Windows: ${{ needs.windows.result }},
            Linux: ${{ needs.linux.result }}
        run: |
          shopt -s nullglob
          files=(release-artifacts/*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No platform built successfully; nothing to release"
            exit 1
          fi
          {
            if [[ -n "${PR_NUMBER}" ]]; then
              echo "Built from #${PR_NUMBER}: ${PR_TITLE}"
            else
              echo "Manual build of ${BUILD_REF}"
            fi
            echo
            echo "Builds: ${RESULTS}"
            echo
            echo "Desktop builds are unsigned. macOS: after installing, run \`xattr -dr com.apple.quarantine /Applications/Phoebe+.app\`. Windows: SmartScreen > More info > Run anyway."
          } > notes.md
          # Re-running a failed platform job re-runs this step too: add its files to the
          # release the first attempt created instead of failing on the existing tag.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md
          else
            gh release create "${TAG}" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${BUILD_REF}" \
              --title "Phoebe+ ${VERSION}" \
              --notes-file notes.md \
              --latest
          fi
